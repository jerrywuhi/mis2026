<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>天氣預報查詢</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .container { border: 1px solid #ccc; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { padding: 8px; margin-right: 5px; }
        button { padding: 8px 15px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        .result { margin-top: 20px; padding: 10px; background-color: #f8f9fa; border-left: 5px solid #007bff; }
    </style>
</head>
<body>

<div class="container">
    <h2>即時天氣查詢</h2>
    <form method="POST">
        <input type="text" name="city" placeholder="請輸入縣市 (如：台北市)" required>
        <button type="submit">查詢</button>
    </form>

    {% if result %}
        <div class="result">
            {% if result.error %}
                <p style="color: red;">{{ result.error }}</p>
            {% else %}
                <p><strong>{{ result.city }}</strong> 目前天氣預報：{{ result.description }}</p>
                <p>降雨機率：{{ result.rain }}%</p>
            {% endif %}
        </div>
    {% endif %}
</div>

</body>
</html>

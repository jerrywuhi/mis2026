<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台中市十大肇事路口統計</title>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; background-color: #f0f2f5; padding: 40px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: #34495e; color: white; padding: 12px; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #ddd; }
        tr:hover { background-color: #f9f9f9; }

        .rank { font-weight: bold; width: 50px; text-align: center; }
        /* 前三名美化 */
        .rank-1 { color: #FFD700; font-size: 1.2em; } /* 金 */
        .rank-2 { color: #C0C0C0; font-size: 1.1em; } /* 銀 */
        .rank-3 { color: #CD7F32; font-size: 1.1em; } /* 銅 */
        
        .count-badge {
            background-color: #e74c3c;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
        }
        .reason-text { color: #7f8c8d; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚠️ 台中市十大肇事路口排行榜</h1>
        <table>
            <thead>
                <tr>
                    <th>排名</th>
                    <th>路口名稱</th>
                    <th>肇事件數</th>
                    <th>主要肇因</th>
                </tr>
            </thead>
            <tbody>
                {% for item in locations %}
                <tr>
                    <td class="rank rank-{{ loop.index if loop.index <= 3 else 'other' }}">
                        {{ loop.index }}
                    </td>
                    <td><strong>{{ item['路口名稱'] }}</strong></td>
                    <td><span class="count-badge">{{ item['總件數'] }} 件</span></td>
                    <td class="reason-text">{{ item['主要肇原因'] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
